<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Publier — localiser la maison</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3966}a:hover{color:#142849}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F5F6F8; color: #14161B; font-family: 'Atkinson Hyperlegible', sans-serif; display: flex; flex-direction: column">

  <header style="padding: 14px 20px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="#" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14161B">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <span style="font-size: 13px; font-weight: 700; color: #5B6270">Étape 3 sur 6</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
      <span style="height: 6px; border-radius: 6px; background: #1E3966"></span>
      <span style="height: 6px; border-radius: 6px; background: #1E3966"></span>
      <span style="height: 6px; border-radius: 6px; background: #C4520F"></span>
      <span style="height: 6px; border-radius: 6px; background: #D3D8E0"></span>
      <span style="height: 6px; border-radius: 6px; background: #D3D8E0"></span>
      <span style="height: 6px; border-radius: 6px; background: #D3D8E0"></span>
    </div>
    <h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Où se trouve le logement ?</h1>
  </header>

  <div style="position: relative; height: 290px; margin: 0 20px; border-radius: 18px; overflow: hidden; background: #ECEFEA; border: 1px solid #D3D8E0">
    <svg width="350" height="290" viewBox="0 0 350 290" aria-hidden="true" style="position: absolute; inset: 0">
      <path d="M-10 230 C 80 190, 160 240, 240 200 S 340 150, 360 140 L 360 190 C 300 200, 240 260, 160 270 S 40 270, -10 290 Z" fill="#A9C4D6"></path>
      <path d="M0 90 L350 60" stroke="#FFFFFF" stroke-width="7"></path>
      <path d="M110 0 L150 290" stroke="#FFFFFF" stroke-width="7"></path>
      <path d="M260 0 L240 200" stroke="#FFFFFF" stroke-width="4"></path>
      <circle cx="190" cy="132" r="34" fill="#1E3966" fill-opacity="0.12" stroke="#1E3966" stroke-width="1.5"></circle>
    </svg>
    <svg width="40" height="52" viewBox="0 0 40 52" aria-hidden="true" style="position: absolute; left: 170px; top: 84px">
      <path d="M20 50 C 20 50, 4 30, 4 18 A 16 16 0 0 1 36 18 C 36 30, 20 50, 20 50 Z" fill="#C4520F" stroke="#FFFFFF" stroke-width="3"></path>
      <circle cx="20" cy="18" r="6" fill="#FFFFFF"></circle>
    </svg>
    <span style="position: absolute; left: 12px; top: 12px; background: #FFFFFF; border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 700; color: #1E3966">Précision : ± [N] m</span>
    <span style="position: absolute; right: 10px; bottom: 8px; font-size: 10px; color: #5B6270">© contributeurs OpenStreetMap</span>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 0; border-radius: 14px; background: #C4520F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
      Localiser ma maison
    </button>
    <p style="margin: 0; font-size: 13px; color: #5B6270; text-align: center">Tu n'es pas sur place ? Touche la carte ou déplace le repère.</p>

    <fieldset style="border: 0; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; margin-bottom: 6px">Ce que voient les étudiants</legend>
      <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 2px solid #1E3966; background: #E3E8F2">
        <input type="radio" name="precision" checked style="accent-color: #1E3966; margin-top: 3px">
        <span><span style="font-weight: 700; font-size: 15px">Zone approximative</span> <span style="font-size: 12px; font-weight: 700; color: #1F5C38">recommandé</span><br><span style="font-size: 13px; color: #3A3F4A">Un cercle d'environ 150 m, jamais la maison exacte.</span></span>
      </label>
      <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1.5px solid #D3D8E0; background: #FFFFFF">
        <input type="radio" name="precision" style="accent-color: #1E3966; margin-top: 3px">
        <span><span style="font-weight: 700; font-size: 15px">Position exacte</span><br><span style="font-size: 13px; color: #3A3F4A">Le repère précis est visible par tous.</span></span>
      </label>
    </fieldset>
  </div>

  <div style="margin-top: auto; padding: 12px 20px 20px; display: flex; gap: 10px; background: #FFFFFF; border-top: 1px solid #E3E6EC">
    <button type="button" style="min-height: 52px; padding: 0 18px; border: 1.5px solid #D3D8E0; border-radius: 14px; background: #FFFFFF; color: #14161B; font-family: inherit; font-size: 16px; font-weight: 700">Retour</button>
    <button type="button" style="flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: #1E3966; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Confirmer la position</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

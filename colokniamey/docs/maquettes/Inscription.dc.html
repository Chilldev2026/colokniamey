    </div>

      <div style="display: flex; gap: 8px">

    <div style="display: flex; flex-direction: column; gap: 4px">

      <input id="email" type="email" style="min-height: 44px; padding: 0 12px; border: 1.5px solid #D3D8E0; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="mdp" style="font-size: 13px; font-weight: 700; color: #5B6270">Mot de passe</label>
      <input id="mdp" type="password" style="min-height: 44px; padding: 0 12px; border: 1.5px solid #D3D8E0; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px">
      <span style="font-size: 12px; color: #5B6270">8 caractères minimum</span>
    </div>
    <label style="display: flex; gap: 10px; align-items: flex-start; min-height: 44px; font-size: 13px; line-height: 1.4; color: #3A3F4A">

    <p style="margin: 0; text-align: center; font-size: 14px">Déjà inscrit ? <a href="#" style="font-weight: 700">Se connecter</a></p>
